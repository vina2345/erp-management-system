spring.application.name=erp-backend
server.port=8080

# Default database: in-memory H2 (SQL, zero setup).
# For MySQL run with the "mysql" profile (see application-mysql.properties).
spring.datasource.url=jdbc:h2:mem:erpdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Allowed frontend origins (React/Vite dev server = 5173)
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000
